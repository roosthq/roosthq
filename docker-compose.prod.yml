# Production overlay: single-origin reverse proxy + Cloudflare Tunnel.
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  # Run the compiled build directly - no dev watch-mode file-watcher in
  # prod. That watcher restarting itself on a file change can lose the race
  # against its own old process (both briefly fighting over :3000), leaving
  # a stale pre-deploy process still answering requests while docker reports
  # the container as healthy. `!reset` drops the dev bind-mount from
  # docker-compose.yml so nothing shadows the image's baked-in dist/ -
  # deploys are purely "rebuild the image", matching the documented `--build`
  # flow exactly, just without the fragile live-reload underneath it.
  server:
    command: npm run start:prod
    volumes: !reset []

  # Explicitly re-target `runtime` - compose deep-merges the `build:` mapping
  # across files rather than replacing it wholesale, so leaving `target` out
  # here would silently inherit the base file's `target: dev` (hot-reload
  # stage, no built dist/ at all) instead of overriding it. Learned that one
  # by shipping it: the resulting prod image's own CMD was `npm run dev`.
  # VITE_API_BASE_URL has to be a build ARG now, not a runtime env var -
  # `vite build` inlines it at image-build time (that's the whole point of
  # moving the build there), so setting it at container start would be too
  # late to do anything.
  web:
    build:
      context: ./web
      target: runtime
      args:
        VITE_API_BASE_URL: /api
    volumes: !reset []

  # Reverse proxy: routes /api to the server, everything else to the frontend.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # Cloudflare Tunnel connector - no inbound ports opened on your router.
  # Create a tunnel in the Cloudflare Zero Trust dashboard, point the public
  # hostname at http://caddy:80, and put the connector token in .env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

  # Nightly mysqldump to a host-visible folder, gzipped, with automatic
  # cleanup of anything older than BACKUP_RETENTION_DAYS. Runs as its own
  # container (not app code) so it keeps going across app redeploys.
  backup:
    image: mysql:8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /backups
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          echo "[backup] $$ts starting dump"
          if mysqldump --no-tablespaces -h db -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" | gzip > "/backups/roosthq_$${ts}.sql.gz"; then
            echo "[backup] $$ts dump ok"
          else
            echo "[backup] $$ts dump FAILED"
            rm -f "/backups/roosthq_$${ts}.sql.gz"
          fi
          find /backups -name 'roosthq_*.sql.gz' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          echo "[backup] sleeping 24h"
          sleep 86400
        done

volumes:
  caddy_data:
