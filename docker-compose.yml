services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      WEB_URL: ${WEB_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      DEFAULT_COLOR_THEME: ${DEFAULT_COLOR_THEME}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE}
      DEFAULT_FEATURE_TOKENS: ${DEFAULT_FEATURE_TOKENS}
      DEFAULT_FEATURE_CHORES: ${DEFAULT_FEATURE_CHORES}
      DEFAULT_FEATURE_STORE: ${DEFAULT_FEATURE_STORE}
      DEFAULT_FEATURE_AWARDS: ${DEFAULT_FEATURE_AWARDS}
      DEFAULT_FEATURE_HOUSEHOLD: ${DEFAULT_FEATURE_HOUSEHOLD}
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules

  web:
    # Dockerfile's default (final) stage is the prod static-file server -
    # dev wants the `dev` stage instead (node_modules + hot-reload vite
    # server; source gets bind-mounted over it below anyway). No `command:`
    # override needed - the `dev` stage's own CMD already runs `npm run dev`;
    # setting one here anyway would leak into docker-compose.prod.yml's merge
    # (compose merges `command:` across -f files same as `build:` - learned
    # that the hard way immediately after fixing the exact same issue for
    # `target`, in the very same deploy).
    build:
      context: ./web
      target: dev
    restart: unless-stopped
    depends_on:
      - server
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  db_data:
