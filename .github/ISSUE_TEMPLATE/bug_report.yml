name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not post it here. See SECURITY.md for private reporting.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version (Settings, Updates) or commit
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Phone or tablet browser
        - Computer browser
        - Kiosk display
        - Server or deploy
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (docker compose logs server), with secrets removed
      render: text
